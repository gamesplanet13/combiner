<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<title>Label Cropper & Generator (Advanced Version)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<style>
  body { font-family: sans-serif; padding: 1rem; background: #fff; color: #000; transition: background 0.3s, color 0.3s; }
  .dark body { background: #121212; color: #e0e0e0; }
  .controls {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 1rem;
  }
  .controls button, .controls select, .controls input[type="file"], .controls input[type="text"] {
    padding: 10px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    transition: background 0.3s, color 0.3s, border 0.3s;
  }
  .dark .controls button, .dark .controls select, .dark .controls input {
    background: #333;
    border: 1px solid #666;
    color: #eee;
  }
  .controls input[type="text"]#layoutInput {
    width: 70px;
  }
  .preview {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    border: 2px dashed #bbb;
    padding: 10px;
    min-height: 150px;
    transition: border 0.3s;
  }
  .dark .preview {
    border-color: #666;
  }
  .preview-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .preview img {
    height: 100px;
    border: 1px solid #aaa;
  }
  button.small {
    font-size: 0.8rem;
    padding: 2px 5px;
    margin-top: 2px;
  }
  .rainbow-text {
    font-size: 1.8rem;
    font-weight: bold;
    background: linear-gradient(270deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00d4, #ff0000);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 8s linear infinite alternate;
    text-align: center;
  }
  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
  .footer, .header {
    text-align: center;
    font-size: 0.9rem;
    margin: 10px 0;
    color: inherit;
  }
</style>
</head>

<body>
<div class="header">Made by Rajinder Singh (GamesPlanet) @2025</div>
<h2 class="rainbow-text">Label Cropper & Generator (Advanced Version)</h2>

<div class="controls">
  <input type="file" id="fileInput" multiple accept="application/pdf,image/*">

  <label for="layoutInput">Layout:</label>
  <input type="text" id="layoutInput" placeholder="2x4" pattern="^[1-9][0-9]*x[1-9][0-9]*$" required>

  <label for="orientationSelect">Orientation:</label>
  <select id="orientationSelect">
    <option value="portrait">Portrait</option>
    <option value="landscape">Landscape</option>
  </select>

  <label for="pageSizeSelect">Page Size:</label>
  <select id="pageSizeSelect">
    <option value="A4" selected>A4 (Default)</option>
    <option value="Letter">Letter</option>
    <option value="Legal">Legal</option>
    <option value="A5">A5</option>
  </select>

  <label for="colorModeSelect">Color:</label>
  <select id="colorModeSelect">
    <option value="color" selected>Color</option>
    <option value="bw">Black & White</option>
  </select>

  <button onclick="generatePDF()">Generate PDF</button>
  <button onclick="downloadPDF()">Download</button>
  <button onclick="printPDFDirect()">Print</button>
  <button id="toggleStamp" onclick="toggleStamp()">Auto-Stamp: OFF</button>
  <button onclick="toggleTheme()">Switch Theme</button>
</div>

<div id="preview" class="preview"></div>
<div id="pdfPreview"></div>
<div class="footer">Made by Rajinder Singh (GamesPlanet) @2025</div>

<script>
/* Full JavaScript */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
let filesData = [], generatedBlob = null, croppedImages = [], fitFlags = [], autoStampEnabled = false;

const pageSizes = { A4: {width:595.28,height:841.89}, Letter:{width:612,height:792}, Legal:{width:612,height:1008}, A5:{width:419.53,height:595.28} };

function toggleStamp() {
  autoStampEnabled = !autoStampEnabled;
  document.getElementById('toggleStamp').innerText = 'Auto-Stamp: ' + (autoStampEnabled ? 'ON' : 'OFF');
}

function toggleTheme() {
  document.documentElement.classList.toggle('dark');
}

function rotateImage(index) {
  const original = croppedImages[index];
  const rotated = document.createElement("canvas");
  rotated.width = original.height; rotated.height = original.width;
  const ctx = rotated.getContext("2d");
  ctx.translate(rotated.width/2, rotated.height/2); ctx.rotate(Math.PI/2);
  ctx.drawImage(original, -original.width/2, -original.height/2);
  croppedImages[index] = rotated;
  showPreview(); saveSettings();
}

function toggleFitImage(index) { fitFlags[index] = !fitFlags[index]; showPreview(); saveSettings(); }

function showPreview() {
  const preview = document.getElementById("preview");
  preview.innerHTML = '';
  croppedImages.forEach((canvas, index) => {
    const div = document.createElement("div");
    div.className = "preview-item";
    const img = document.createElement("img");
    img.src = canvas.toDataURL();
    const rotateBtn = document.createElement("button");
    rotateBtn.innerText = "Rotate"; rotateBtn.className = "small";
    rotateBtn.onclick = () => rotateImage(index);
    const fitBtn = document.createElement("button");
    fitBtn.innerText = fitFlags[index] ? "Unfit" : "Fit"; fitBtn.className = "small";
    fitBtn.onclick = () => toggleFitImage(index);
    div.appendChild(img); div.appendChild(rotateBtn); div.appendChild(fitBtn); preview.appendChild(div);
  });
}

async function trimCanvas(canvas) {
  const ctx = canvas.getContext("2d"), {width, height} = canvas, imgData = ctx.getImageData(0,0,width,height), data = imgData.data;
  let top=height, bottom=0, left=width, right=0;
  for (let y=0; y<height; y++) for (let x=0; x<width; x++) {
    const i=(y*width+x)*4;
    if (data[i]<250||data[i+1]<250||data[i+2]<250) {
      if (x<left) left=x; if (x>right) right=x; if (y<top) top=y; if (y>bottom) bottom=y;
    }
  }
  const trimmedWidth=right-left+1, trimmedHeight=bottom-top+1;
  const trimmed = document.createElement("canvas");
  trimmed.width=trimmedWidth; trimmed.height=trimmedHeight;
  trimmed.getContext("2d").drawImage(canvas,left,top,trimmedWidth,trimmedHeight,0,0,trimmedWidth,trimmedHeight);
  return trimmed;
}

async function extractImagesFromFiles() {
  const images = [];
  for (const file of filesData) {
    if (file.type==='application/pdf') {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buffer}).promise;
      for (let i=1; i<=pdf.numPages; i++) {
        const page = await pdf.getPage(i), viewport = page.getViewport({scale:3});
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
        const trimmed = await trimCanvas(canvas); images.push(trimmed);
      }
    } else if (file.type.startsWith("image/")) {
      const img = new Image();
      img.src=URL.createObjectURL(file);
      await img.decode();
      const canvas = document.createElement("canvas");
      canvas.width=img.width; canvas.height=img.height;
      canvas.getContext("2d").drawImage(img,0,0);
      const trimmed = await trimCanvas(canvas); images.push(trimmed);
    }
  }
  return images;
}

function convertCanvasToGrayscale(originalCanvas) {
  const canvas = document.createElement("canvas");
  canvas.width=originalCanvas.width; canvas.height=originalCanvas.height;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(originalCanvas,0,0);
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height), data=imgData.data;
  for (let i=0;i<data.length;i+=4) {
    const avg=(data[i]+data[i+1]+data[i+2])/3;
    data[i]=data[i+1]=data[i+2]=avg;
  }
  ctx.putImageData(imgData,0,0);
  return canvas;
}

async function generatePDF() {
  const layout=document.getElementById('layoutInput').value.trim();
  if (!layout.match(/^[1-9][0-9]*x[1-9][0-9]*$/)) { alert("Please enter layout like 2x4."); return; }
  const [cols, rows]=layout.split('x').map(Number);
  const orientation=document.getElementById('orientationSelect').value;
  const pageSize=document.getElementById('pageSizeSelect').value;
  const colorMode=document.getElementById('colorModeSelect').value;
  const size=pageSizes[pageSize];
  const PAGE_WIDTH=orientation==="portrait"?size.width:size.height;
  const PAGE_HEIGHT=orientation==="portrait"?size.height:size.width;
  if (croppedImages.length===0) {
    croppedImages=await extractImagesFromFiles();
    fitFlags.length=croppedImages.length;
    fitFlags.fill(false);
  }
  showPreview();
  const { PDFDocument, rgb }=PDFLib;
  const pdfDoc=await PDFDocument.create();
  const labelWidth=PAGE_WIDTH/cols, labelHeight=PAGE_HEIGHT/rows;
  for (let i=0;i<croppedImages.length;i+=cols*rows) {
    const page=pdfDoc.addPage([PAGE_WIDTH,PAGE_HEIGHT]);
    const chunk=croppedImages.slice(i,i+cols*rows);
    for (let j=0;j<chunk.length;j++) {
      let canvas=chunk[j];
      if (colorMode==='bw') { canvas=convertCanvasToGrayscale(canvas); }
      const imageBytes=await canvasToPNGBytes(canvas);
      const embeddedImage=await pdfDoc.embedPng(imageBytes);
      let x=(j%cols)*labelWidth;
      let y=PAGE_HEIGHT-labelHeight*(Math.floor(j/cols)+1);
      let width=fitFlags[i+j]?labelWidth:Math.min(labelWidth,labelHeight*canvas.width/canvas.height);
      let height=fitFlags[i+j]?labelHeight:Math.min(labelHeight,labelWidth*canvas.height/canvas.width);
      x+=(labelWidth-width)/2; y+=(labelHeight-height)/2;
      page.drawImage(embeddedImage,{x,y,width,height});
      if (autoStampEnabled) {
        const now=new Date(), dateStr=now.toLocaleDateString(), timeStr=now.toLocaleTimeString();
        const labelNo=`Label #${i+j+1}`;
        page.drawText(`${dateStr}\n${timeStr}\n${labelNo}`,{x:x+5,y:y+5,size:8,color:rgb(0.5,0.5,0.5),lineHeight:10});
      }
    }
  }
  const pdfBytes=await pdfDoc.save();
  generatedBlob=new Blob([pdfBytes],{type:'application/pdf'});
  renderPDFPreview(generatedBlob);
  saveSettings();
}

async function canvasToPNGBytes(canvas) {
  return await new Promise(resolve => {
    canvas.toBlob(blob => { const reader=new FileReader();
    reader.onloadend=()=>resolve(reader.result);
    reader.readAsArrayBuffer(blob); },'image/png',1.0);
  });
}

async function renderPDFPreview(blob) {
  const url=URL.createObjectURL(blob);
  const pdf=await pdfjsLib.getDocument(url).promise;
  const pdfPreview=document.getElementById('pdfPreview');
  pdfPreview.innerHTML='';
  for (let i=1;i<=pdf.numPages;i++) {
    const page=await pdf.getPage(i);
    const viewport=page.getViewport({scale:0.5});
    const canvas=document.createElement('canvas');
    canvas.width=viewport.width; canvas.height=viewport.height;
    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
    pdfPreview.appendChild(canvas);
  }
}

document.getElementById('fileInput').addEventListener('change',e=>{
  filesData=Array.from(e.target.files);croppedImages=[];generatedBlob=null;
  document.getElementById('preview').innerHTML='';document.getElementById('pdfPreview').innerHTML='';
});

function downloadPDF() {
  if (!generatedBlob) return alert("Please generate PDF first!");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(generatedBlob);
  a.download="labels.pdf";
  a.click();
}

function printPDFDirect() {
  if (!generatedBlob) return alert("Please generate PDF first!");
  const url=URL.createObjectURL(generatedBlob);
  const win=window.open(url);
  win.onload=()=>win.print();
}

function saveSettings() {
  localStorage.setItem('layout',document.getElementById('layoutInput').value);
  localStorage.setItem('orientation',document.getElementById('orientationSelect').value);
  localStorage.setItem('fitFlags',JSON.stringify(fitFlags));
}

function loadSettings() {
  const layout=localStorage.getItem('layout');
  const orientation=localStorage.getItem('orientation');
  if (layout) document.getElementById('layoutInput').value=layout;
  if (orientation) document.getElementById('orientationSelect').value=orientation;
  const savedFits=localStorage.getItem('fitFlags');
  if (savedFits) fitFlags=JSON.parse(savedFits);
}
loadSettings();
</script>
</body>
</html>
